name: facemock

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockinterview}
      MYSQL_USER: ${MYSQL_USER:-mock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mock}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    # Tested Chroma 1.4.4; pin the image so REST API behavior stays reproducible.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    volumes:
      - chroma_rag_data:/data

  ocr:
    image: facemock-ocr:latest
    build: ./ocr
    shm_size: 512mb
    volumes:
      - ocr_models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  app:
    image: facemock-app:latest
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_BASE_URL: http://ocr:8000
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-10}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockinterview}
      MYSQL_USER: ${MYSQL_USER:-mock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mock}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHROMA_BASE_URL: http://chromadb:8000
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_SEED_ON_STARTUP: ${KNOWLEDGE_SEED_ON_STARTUP:-true}
      KNOWLEDGE_COLLECTION: ${KNOWLEDGE_COLLECTION:-tech_knowledge_bge_zh_v1}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-3}
      KNOWLEDGE_MIN_SCORE: ${KNOWLEDGE_MIN_SCORE:-0.45}
      QUESTIONS_SEED_ON_STARTUP: ${QUESTIONS_SEED_ON_STARTUP:-true}
      QUESTIONS_INDEX_KNOWLEDGE: ${QUESTIONS_INDEX_KNOWLEDGE:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL_NAME: ${DEEPSEEK_MODEL_NAME:-deepseek-flash}
      SPEECH_ENABLED: ${SPEECH_ENABLED:-false}
      XFYUN_APP_ID: ${XFYUN_APP_ID:-}
      XFYUN_API_KEY: ${XFYUN_API_KEY:-}
      XFYUN_API_SECRET: ${XFYUN_API_SECRET:-}
      SPEECH_RETENTION_DAYS: ${SPEECH_RETENTION_DAYS:-30}
      SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-240}
      SPEECH_STORAGE_PATH: /app/data/recordings
      MODEL_SETTINGS_PATH: /app/data/model-settings
    volumes:
      - speech_recordings:/app/data/recordings
      - model_settings:/app/data/model-settings
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ocr:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  chroma_rag_data:
  speech_recordings:
  model_settings:
  ocr_models:
